name: Build & Release Chrome Extension
run-name: Build & Release Extension ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension Version (e.g., ext-v1.0.0). Leave empty to use manifest.json version.'
        required: false

jobs:
  release-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Determine Version
        id: get_version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            MANIFEST_VERSION=$(jq -r .version chrome-extension/manifest.json)
            echo "VERSION=ext-v${MANIFEST_VERSION}" >> $GITHUB_ENV
            echo "Using version from manifest.json: ext-v${MANIFEST_VERSION}"
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "Using provided version: ${{ github.event.inputs.version }}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        # We need dependencies to run webpack, even though we are not building the electron app
        run: npm ci

      - name: Build Extension
        run: npm run build:extension

      - name: Package Extension
        # Zipping manifest, dist folder (JS code), and assets
        run: zip -r thingy-companion.zip chrome-extension/manifest.json chrome-extension/dist chrome-extension/assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Extension Release ${{ env.VERSION }}
          files: thingy-companion.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
