name: Build & Release for macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.1)'
        required: true

jobs:
  release:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install app dependencies
        run: cd release/app && npm install

      - name: Update package version
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build and package macOS application (unsigned)
        run: npm run package -- --config.mac.hardenedRuntime=false --config.mac.gatekeeperAssess=false

      - name: Create/Update GitHub Release and upload artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: "Automated macOS release for version ${{ github.event.inputs.version }}. Note: This is an unsigned build."
          files: |
            release/build/*.dmg
            release/build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
