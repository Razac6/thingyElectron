name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v0.1.1)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest # Release can be done from any OS

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true # Merge all artifacts into one directory

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: "Automated release for version ${{ github.event.inputs.version }}."
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
