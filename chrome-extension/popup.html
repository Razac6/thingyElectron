<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; }
    h3 { margin: 0 0 10px 0; color: #023047; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    .status { font-size: 11px; color: #666; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ccc; }
    .dot.connected { background-color: #4caf50; }
    
    .block-btn {
      width: 100%;
      padding: 10px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      margin-bottom: 15px;
    }
    .block-btn:hover { background-color: #b71c1c; }
    
    .list-header { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
    #blocked-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
    .blocked-item { 
      background: white; 
      border: 1px solid #eee; 
      padding: 8px; 
      border-radius: 4px; 
      margin-bottom: 5px; 
      font-size: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .remove-btn { 
      background: none; border: none; color: #999; cursor: pointer; font-size: 14px; padding: 0 5px;
    }
    .remove-btn:hover { color: #d32f2f; }
    .empty-msg { font-size: 11px; color: #999; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>Thingy Companion</h3>
  <div class="status">
    <div id="status-dot" class="dot"></div>
    <span id="status-text">Disconnected</span>
  </div>

  <button id="block-btn" class="block-btn">Block Current Site</button>

  <div class="list-header">FORCE BLOCKED (EXTENSION ONLY)</div>
  <ul id="blocked-list">
    <!-- Items will be injected here -->
  </ul>
  <div id="empty-msg" class="empty-msg">No locally blocked sites.</div>

  <script src="popup.js"></script>
</body>
</html>
